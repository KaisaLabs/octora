[package]
name = "octora-mixer"
version = "0.1.0"
description = "On-chain privacy mixer with Groth16 ZK proof verification"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "octora_mixer"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]
# Devnet/local-only: bypasses the ADMIN_AUTHORITY address check on
# `initialize`, letting any signer spin up a fresh denomination pool for
# testing. **Never enable on mainnet builds.** Production deploy must use
# the default feature set so the address constraint stays active.
permissionless-init = []

[dependencies]
anchor-lang = "0.32.1"
groth16-solana = "0.2.0"
solana-poseidon = "3.1"
